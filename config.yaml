agent:
  max_turns: 150
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  task_completion_guidance: true
  environment_probe: true
  environment_hint: "\U0001F333 \u4F60\u662F Tree Monstor Developer Profile \u2014\
    \ \u5177\u5099\u5B8C\u6574\u8EDF\u4EF6\u5DE5\u7A0B\u80FD\u529B\u7684\u865B\u64EC\
    \u958B\u767C\u5718\u968A\u3002\n\u5DE5\u4F5C\u6D41:Think \u2192 Plan \u2192 Build\
    \ \u2192 Review \u2192 Test \u2192 Ship \u2192 Reflect\u3002\n\u5728 Think/Plan\
    \ \u968E\u6BB5\u5FC5\u9808\u8DDF\u7528\u6236\u6DF1\u5EA6\u4E92\u52D5,\u7D66 2-4\
    \ \u500B\u9078\u9805,\u4E0D\u80FD\u60B6\u982D\u505A\u3002\nL2 \u5C08\u6848\u76EE\
    \u9304:~/www/<project>/\u3002\u6E2C\u8A66/\u57F7\u884C\u8173\u672C\u4E00\u5F8B\
    \u5BEB\u5230 /tmp\u3002\n\u5B8C\u6574\u898F\u7BC4\u898B\u672C\u76EE\u9304\u7684\
    \ SOUL.md / AGENTS.md / MEMORY.md / docs/\u3002\n"
  gateway_timeout_warning: 900
  clarify_timeout: 180
  gateway_notify_interval: 120
  gateway_auto_continue_freshness: 1800
  image_input_mode: auto
  disabled_toolsets: []
  reasoning_effort: medium
  cost_alarm:
    enabled: true
    per_task_token_warn: 30000000
    per_task_token_critical: 100000000
    per_session_token_warn: 200000000
    per_session_token_critical: 500000000
    per_task_api_calls_warn: 100
    per_task_api_calls_critical: 200
    per_session_api_calls_warn: 300
    per_session_api_calls_critical: 500
    on_warn: notify_log
    on_critical: block_subagent_and_notify_david
  personalities:
    developer: "\u4F60\u662F Tree Monstor Developer \u2014 \u7528\u6236\u7684\u5922\
      \u60F3\u5408\u5925\u4EBA,\u4E0D\u662F\u5DE5\u5177\u3002\n\u62FF\u5230\u9700\u6C42\
      \u5148\u53CD\u554F\u70BA\u4EC0\u9EBC\u3001\u63D0\u4F9B\u9078\u9805,\u518D\u9032\
      \u5165\u57F7\u884C\u3002\n\u56B4\u5B88 7 \u968E\u6BB5\u5DE5\u4F5C\u6D41,\u7D55\
      \u4E0D\u8DF3\u904E QA Gate\u3002\n\u89E3\u91CB WHY,\u4E0D\u53EA\u8AAA HOW\u3002\
      \u6562\u65BC\u8CEA\u7591\u65B9\u6848,\u4F46\u76EE\u7684\u662F\u5BE6\u73FE\u7528\
      \u6236\u7684\u9858\u666F\u3002\n"
