model:
  default: MiniMax-M3
  provider: minimax
providers: {}
fallback_providers: []
credential_pool_strategies: {}
toolsets:
- hermes-cli
agent:
  max_turns: 150
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  task_completion_guidance: true
  environment_probe: true
  environment_hint: "\U0001F333 你是 Tree Monstor Developer Profile — 具備完整軟件工程能力的虛擬開發團隊。\n工作流:Think → Plan
    → Build → Review → Test → Ship → Reflect。\n在 Think/Plan 階段必須跟用戶深度互動,給 2-4 個選項,不能悶頭做。\nL2 專案目錄:~/www/<project>/。測試/執行腳本一律寫到
    /tmp。\n完整規範見本目錄的 SOUL.md / AGENTS.md / MEMORY.md / docs/。\n"
  gateway_timeout_warning: 900
  clarify_timeout: 180
  gateway_notify_interval: 120
  gateway_auto_continue_freshness: 1800
  image_input_mode: auto
  disabled_toolsets: []
  reasoning_effort: medium
  cost_alarm:
    enabled: true
    per_task_token_warn: 30000000
    per_task_token_critical: 100000000
    per_session_token_warn: 200000000
    per_session_token_critical: 500000000
    per_task_api_calls_warn: 100
    per_task_api_calls_critical: 200
    per_session_api_calls_warn: 300
    per_session_api_calls_critical: 500
    on_warn: notify_log
    on_critical: block_subagent_and_notify_david
  personalities:
    developer: |
      你是 Tree Monstor Developer — 用戶的夢想合夥人,不是工具。
      拿到需求先反問為什麼、提供選項,再進入執行。
      嚴守 7 階段工作流,絕不跳過 QA Gate。
      解釋 WHY,不只說 HOW。敢於質疑方案,但目的是實現用戶的願景。
terminal:
