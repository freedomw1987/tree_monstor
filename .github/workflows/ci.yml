name: CI

on:
  # workflow_dispatch：讓「首次真實 Actions 驗證」不必等下次 push（TMO-039）
  workflow_dispatch:
  push:
    # repo 預設分支是 master；只寫 main 會讓 CI 從未執行（TMO-029）
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils pandoc tesseract-ocr ffmpeg
          python3 -m pip install python-pptx
          # bats-core 固定版本（TMO-041）：apt 的 bats 版本會隨 runner 映像漂移，
          # 探針行為（陣列展開、輸出格式）就會跟著變 → 兩平台都裝同一個 tag。
          git clone --branch v1.14.0 --depth 1 https://github.com/bats-core/bats-core.git
          sudo ./bats-core/install.sh /usr/local

      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install poppler pandoc tesseract ffmpeg
          python3 -m pip install python-pptx
          # bats-core 固定版本（TMO-041）＋與 Linux 同一個 tag（見上方說明）
          git clone --branch v1.14.0 --depth 1 https://github.com/bats-core/bats-core.git
          sudo ./bats-core/install.sh /usr/local

      - name: Verify ffmpeg version and flags
        # TMO-042：兩平台版本不同（apt ffmpeg 6.x / brew 8.x），ffmpeg 8 已移除 -vsync。
        # 這步鎖「版本底線 5.1」+ 用本 repo 真的在用的旗標組合（-vf select/showinfo +
        # -fps_mode vfr + -f null -）實測能力，缺一即紅。
        run: bash scripts/ci/check-ffmpeg-version.sh

      - name: Build PoC venv (httpx + PyYAML)
        run: bash skills/regression-guard/PoC/setup-venv.sh

      - name: Run bats tests
        run: bats tests/

      - name: Run skill-local probes
        # TMO-047：skills/*/tests/*.bats 過去從未被 CI 執行（改了不會擋）。
        # 這些探針預設掃「已安裝」的 skills，故必須以環境變數把 root 指到 repo，
        # 否則掃不到檔＝靜默綠（原本其中一支甚至會 skip 掉）。
        # 守門探針：tests/env-equivalence.bats ENV-EQ-11。
        run: SKILLS_DIR_OVERRIDE="$PWD/skills" bats skills/*/tests/*.bats

      - name: Verify bash syntax
        run: |
          # 全部 dav-wiki scripts（TMO-039：原本只驗 3 支，改到其他 6 支不會被擋）
          for f in skills/dav-wiki/scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "OK: $(ls skills/dav-wiki/scripts/*.sh | wc -l | tr -d ' ') scripts syntax-checked"

      - name: Verify SKILL.md size (≤ 150 lines)
        # 自動列舉所有 skill 主檔（不再只檢查一個檔案）：
        # 硬編單檔＝其他主檔改爆不會被擋（同 TMO-038 ④ / TMO-033 的教訓）。
        # 守門探針：tests/skill-size-guard.bats（SSG-1/2/3）。
        run: bash scripts/ci/check-skill-size.sh

      - name: Verify Python heredoc syntax
        run: bash scripts/ci/check-python-heredocs.sh

  lint-only:
    name: Markdown lint
    runs-on: ubuntu-latest
    # TMO-037（2026-10-05）：債已清 0，本 job 恢復阻擋（不再設 job 級容錯）。
    # 守門探針：tests/markdownlint-guard.bats（MLG-1/2 鎖住 job 存在且會擋、MLG-3/4/8 鎖 glob 不縮小）。
    # 注意：glob 必須涵蓋 tests/fixtures/**/*.md，且不得把 .venv/ 納入（見 .markdownlint-cli2.jsonc）。
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g markdownlint-cli2
      - name: Lint all markdown files
        run: |
          markdownlint-cli2 "skills/**/*.md" "docs/**/*.md" "tests/**/*.md" "*.md"
