name: CI

on:
  # workflow_dispatch：讓「首次真實 Actions 驗證」不必等下次 push（TMO-039）
  workflow_dispatch:
  push:
    # repo 預設分支是 master；只寫 main 會讓 CI 從未執行（TMO-029）
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck：Gate 2 的靜態檢查（NYH-6 決策 A：CI 過去完全沒跑 shellcheck）
          sudo apt-get install -y poppler-utils pandoc tesseract-ocr ffmpeg shellcheck
          python3 -m pip install python-pptx
          # bats-core 固定版本（TMO-041）：apt 的 bats 版本會隨 runner 映像漂移，
          # 探針行為（陣列展開、輸出格式）就會跟著變 → 兩平台都裝同一個 tag。
          # 2026-10-05 CI 首跑修正：clone 到 $RUNNER_TEMP，**不汙染工作區**——
          # 否則 `bats-core/test/**` 會被 ENV-EQ-12 的 orphan 掃描當成 repo 的孤兒 .bats（紅）。
          git clone --branch v1.14.0 --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local

      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # bash：macOS runner 的 /bin/bash 是 3.2，而 bats 1.14.0 的 test-name 編碼在
          # 「bash 3.2 + UTF-8 locale」下會把非 ASCII 測試名編壞 → 靜默丟掉 31 條測試
          # （2026-10-05 CI 首跑實測）。裝 bash 5 並排到 PATH 最前，讓 `env bash` 解析到 5.x，
          # 與開發者本機、與 ubuntu leg 等價；3.2 覆蓋由本機鎖 ENV-EQ-19 接手。
          # shellcheck：Gate 2 的靜態檢查（NYH-6 決策 A）
          brew install poppler pandoc tesseract ffmpeg shellcheck bash
          python3 -m pip install python-pptx
          # bats-core 固定版本（TMO-041）＋與 Linux 同一個 tag（見上方說明）
          git clone --branch v1.14.0 --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Verify ffmpeg version and flags
        # TMO-042：兩平台版本不同（apt ffmpeg 6.x / brew 8.x），ffmpeg 8 已移除 -vsync。
        # 這步鎖「版本底線 5.1」+ 用本 repo 真的在用的旗標組合（-vf select/showinfo +
        # -fps_mode vfr + -f null -）實測能力，缺一即紅。
        run: bash scripts/ci/check-ffmpeg-version.sh

      - name: Build PoC venv (httpx + PyYAML)
        run: bash skills/regression-guard/PoC/setup-venv.sh

      - name: Run bats tests
        run: bats tests/

      - name: Run skill-local probes
        # TMO-047：skills/*/tests/*.bats 過去從未被 CI 執行（改了不會擋）。
        # 這些探針預設掃「已安裝」的 skills，故必須以環境變數把 root 指到 repo，
        # 否則掃不到檔＝靜默綠（原本其中一支甚至會 skip 掉）。
        # 守門探針：tests/env-equivalence.bats ENV-EQ-11。
        run: SKILLS_DIR_OVERRIDE="$PWD/skills" bats skills/*/tests/*.bats

      - name: ShellCheck every tracked shell file
        # NYH-6（2026-10-05 決策 A）：CI 過去完全沒跑 shellcheck，且下一步只 glob 硬編子集
        # → 「本機 Gate 2 全綠」不等於 CI 會擋。這裡與本機 Gate 2 用同一條自我列舉指令。
        # 守門探針：tests/env-equivalence.bats ENV-EQ-18。
        run: shellcheck -x -S style $(git ls-files '*.sh' '*.bash')

      - name: Verify bash syntax
        # NYH-6 決策 A：原本只 glob `skills/dav-wiki/scripts/*.sh`（硬編子集，漏 install.sh、
        # lib/**、scripts/ci/**、skills/*/PoC/**、tests/helpers/**）→ 改為自我列舉。
        # 守門探針：tests/env-equivalence.bats ENV-EQ-18。
        run: |
          n=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            bash -n "$f" || exit 1
            n=$((n + 1))
          done <<< "$(git ls-files '*.sh' '*.bash')"
          echo "OK: $n shell files syntax-checked"

      - name: Verify SKILL.md size (≤ 150 lines)
        # 自動列舉所有 skill 主檔（不再只檢查一個檔案）：
        # 硬編單檔＝其他主檔改爆不會被擋（同 TMO-038 ④ / TMO-033 的教訓）。
        # 守門探針：tests/skill-size-guard.bats（SSG-1/2/3）。
        run: bash scripts/ci/check-skill-size.sh

      - name: Verify Python heredoc syntax
        run: bash scripts/ci/check-python-heredocs.sh

  lint-only:
    name: Markdown lint
    runs-on: ubuntu-latest
    # TMO-037（2026-10-05）：債已清 0，本 job 恢復阻擋（不再設 job 級容錯）。
    # 守門探針：tests/markdownlint-guard.bats（MLG-1/2 鎖住 job 存在且會擋、MLG-3/4/8 鎖 glob 不縮小）。
    # 注意：glob 必須涵蓋 tests/fixtures/**/*.md，且不得把 .venv/ 納入（見 .markdownlint-cli2.jsonc）。
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g markdownlint-cli2
      - name: Lint all markdown files
        run: |
          markdownlint-cli2 "skills/**/*.md" "docs/**/*.md" "tests/**/*.md" "*.md"
