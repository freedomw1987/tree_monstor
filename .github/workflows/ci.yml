name: CI

on:
  # workflow_dispatch：讓「首次真實 Actions 驗證」不必等下次 push（TMO-039）
  workflow_dispatch:
  push:
    # repo 預設分支是 master；只寫 main 會讓 CI 從未執行（TMO-029）
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats poppler-utils pandoc tesseract-ocr ffmpeg
          python3 -m pip install python-pptx

      - name: Install test dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bats-core poppler pandoc tesseract ffmpeg
          python3 -m pip install python-pptx

      - name: Build PoC venv (httpx + PyYAML)
        run: bash skills/regression-guard/PoC/setup-venv.sh

      - name: Run bats tests
        run: bats tests/

      - name: Verify bash syntax
        run: |
          # 全部 dav-wiki scripts（TMO-039：原本只驗 3 支，改到其他 6 支不會被擋）
          for f in skills/dav-wiki/scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "OK: $(ls skills/dav-wiki/scripts/*.sh | wc -l | tr -d ' ') scripts syntax-checked"

      - name: Verify SKILL.md size (≤ 150 lines)
        run: |
          LINES=$(wc -l < skills/dav-wiki/SKILL.md)
          if [ "$LINES" -gt 150 ]; then
            echo "::error::SKILL.md too long: $LINES lines (max 150)"
            exit 1
          fi
          echo "OK: SKILL.md has $LINES lines"

      - name: Verify Python heredoc syntax
        run: bash scripts/ci/check-python-heredocs.sh

  lint-only:
    name: Markdown lint
    runs-on: ubuntu-latest
    # TMO-037：lint 債 246 處（184 條長行）未清，先不讓 CI 首跑被它卡紅；
    # 紅燈仍會以 annotation 顯示。清完 TMO-037 後請移除本行，讓 lint 恢復阻擋。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g markdownlint-cli2
      - name: Lint all markdown files
        run: |
          markdownlint-cli2 "skills/**/*.md" "docs/**/*.md" "tests/**/*.md" "*.md"
