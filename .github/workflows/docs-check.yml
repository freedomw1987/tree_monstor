name: docs-consistency

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: docs consistency check
        run: python3 scripts/docs_consistency_check.py
      - name: skills catalog freshness
        run: python3 scripts/generate_skills_catalog.py --check
